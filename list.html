<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>設備狀態分類清單</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f8f9fa; margin: 0; }
        .header-nav { max-width: 650px; margin: 0 auto 15px auto; display: flex; justify-content: space-between; align-items: center; }
        .nav-btn { text-decoration: none; padding: 8px 16px; background-color: #007bff; color: white; border-radius: 5px; font-weight: bold; font-size: 14px; }
        
        .card-container { max-width: 650px; margin: 0 auto 20px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card-container h3 { margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }

        .search-box { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .form-group input { width: 100%; padding: 8px 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; }
        .btn-submit { width: 100%; padding: 10px; background-color: #17a2b8; color: white; border: none; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }

        /* 表格樣式 */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #eee; font-size: 15px; }
        th { background-color: #f1f3f5; }
        
        /* 狀態文字與數量標籤 */
        .status-available { color: #28a745; font-weight: bold; }
        .status-borrowed { color: #dc3545; font-weight: bold; }
        .count-badge { font-size: 14px; padding: 2px 8px; border-radius: 12px; font-weight: normal; background-color: #e9ecef; color: #495057; }
    </style>
</head>
<body>

    <div class="header-nav">
        <h2>📋 設備狀態分類清單</h2>
        <a href="index.html" class="nav-btn">📷 進入掃描頁面</a>
    </div>

    <div style="max-width: 650px; margin: 0 auto;">
        <input type="text" id="search-input" class="search-box" placeholder="🔍 搜尋設備編號或名稱..." onkeyup="filterList()">
    </div>

    <!-- 1. 借出中設備區塊 -->
    <div class="card-container">
        <h3>
            <span>🔴 借出中清單</span>
            <span id="borrowed-count" class="count-badge">0 項</span>
        </h3>
        <table>
            <thead>
                <tr>
                    <th>編號</th>
                    <th>設備名稱</th>
                    <th>狀態</th>
                </tr>
            </thead>
            <tbody id="borrowed-list">
                <tr><td colspan="3" style="text-align:center;">資料載入中...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- 2. 可借用設備區塊 -->
    <div class="card-container">
        <h3>
            <span>🟢 可借用清單</span>
            <span id="available-count" class="count-badge">0 項</span>
        </h3>
        <table>
            <thead>
                <tr>
                    <th>編號</th>
                    <th>設備名稱</th>
                    <th>狀態</th>
                </tr>
            </thead>
            <tbody id="available-list">
                <tr><td colspan="3" style="text-align:center;">資料載入中...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- 新增設備區塊 -->
    <div class="card-container">
        <h3>➕ 新增設備</h3>
        <div class="form-group">
            <label for="add-id">設備編號 (ID) *</label>
            <input type="text" id="add-id" placeholder="例如：1005">
        </div>
        <div class="form-group">
            <label for="add-name">設備名稱 *</label>
            <input type="text" id="add-name" placeholder="例如：投影機">
        </div>
        <div class="form-group">
            <label for="add-brand">廠牌 / 型號</label>
            <input type="text" id="add-brand" placeholder="例如：Epson">
        </div>
        <button class="btn-submit" onclick="addEquipment()">新增設備</button>
    </div>

    <script>
        // ★★★ 請確認為您的 GAS 網頁應用程式網址 ★★★
        const API_URL = "https://script.google.com/macros/s/AKfycbz_iOv3cQFK9_ugdr08HF358U9kVZnJHf2hJnHGGHGV3oMMffIYOihbzhnwcJLkU5Bl/exec"; 

        let equipmentData = [];

        function fetchEquipmentList() {
            fetch(`${API_URL}?action=list`)
                .then(response => response.json())
                .then(data => {
                    equipmentData = data;
                    renderLists(data);
                })
                .catch(err => {
                    console.error("無法取得清單", err);
                });
        }

        function renderLists(data) {
            const borrowedTbody = document.getElementById('borrowed-list');
            const availableTbody = document.getElementById('available-list');
            
            borrowedTbody.innerHTML = "";
            availableTbody.innerHTML = "";

            // 分選資料
            const borrowedItems = data.filter(item => item.status === "借出中");
            const availableItems = data.filter(item => item.status === "可借用");

            // 更新數量統計
            document.getElementById('borrowed-count').innerText = `${borrowedItems.length} 項`;
            document.getElementById('available-count').innerText = `${availableItems.length} 項`;

            // 繪製「借出中」清單
            if (borrowedItems.length === 0) {
                borrowedTbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#888;">目前沒有借出中的設備</td></tr>';
            } else {
                borrowedItems.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${item.id}</td>
                        <td>${item.brand ? item.brand + ' ' : ''}${item.name}</td>
                        <td class="status-borrowed">${item.status}</td>
                    `;
                    borrowedTbody.appendChild(tr);
                });
            }

            // 繪製「可借用」清單
            if (availableItems.length === 0) {
                availableTbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#888;">目前沒有可借用的設備</td></tr>';
            } else {
                availableItems.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${item.id}</td>
                        <td>${item.brand ? item.brand + ' ' : ''}${item.name}</td>
                        <td class="status-available">${item.status}</td>
                    `;
                    availableTbody.appendChild(tr);
                });
            }
        }

        function filterList() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = equipmentData.filter(item => 
                item.id.toLowerCase().includes(query) || 
                item.name.toLowerCase().includes(query) || 
                item.brand.toLowerCase().includes(query)
            );
            renderLists(filtered);
        }

        function addEquipment() {
            const idInput = document.getElementById('add-id');
            const nameInput = document.getElementById('add-name');
            const brandInput = document.getElementById('add-brand');

            const id = idInput.value.trim();
            const name = nameInput.value.trim();
            const brand = brandInput.value.trim();

            if (!id || !name) {
                alert("請填寫【設備編號】與【設備名稱】！");
                return;
            }

            const url = `${API_URL}?action=add&id=${encodeURIComponent(id)}&name=${encodeURIComponent(name)}&brand=${encodeURIComponent(brand)}`;
            
            fetch(url)
                .then(response => response.text())
                .then(msg => {
                    alert(msg);
                    if (msg.includes("成功")) {
                        idInput.value = "";
                        nameInput.value = "";
                        brandInput.value = "";
                        fetchEquipmentList();
                    }
                })
                .catch(err => {
                    alert("新增設備時發生錯誤！");
                    console.error(err);
                });
        }

        fetchEquipmentList();
    </script>
</body>
</html>
